<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="64" height="64">
  <!-- WFG DWG Layers+ (1.9.7): the WFG pentagon with its vertices, cut into five horizontal layers in the
       Viridis palette without its yellow end (CAD layers become QGIS layers), and a plus cut out in the
       middle (the "+" of the name). Transparent where cut. -->
  <defs>
  <clipPath id="pent">
  <polygon points="678,90 918,496 708,903 135,797 166,285"/>
  <circle cx="678" cy="90" r="70"/>
  <circle cx="918" cy="496" r="70"/>
  <circle cx="708" cy="903" r="70"/>
  <circle cx="135" cy="797" r="70"/>
  <circle cx="166" cy="285" r="70"/>
  </clipPath>
  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#fff"/>
  <rect x="469" y="273" width="110" height="460" rx="19" fill="#000"/>
  <rect x="294" y="448" width="460" height="110" rx="19" fill="#000"/>
  </mask>
  </defs>
  <g clip-path="url(#pent)" mask="url(#cut)">
  <rect x="0" y="19.0" width="1024" height="192.6" fill="#7ad151"/>
  <rect x="0" y="209.6" width="1024" height="192.6" fill="#22a884"/>
  <rect x="0" y="400.2" width="1024" height="192.6" fill="#2a788e"/>
  <rect x="0" y="590.8" width="1024" height="192.6" fill="#414487"/>
  <rect x="0" y="781.4" width="1024" height="192.6" fill="#440154"/>
  </g>
</svg>
